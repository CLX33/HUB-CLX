<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning Tournoi</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0d12;--bg2:#13131b;--bg3:#1a1a25;--border:#2a2a3a;
  --accent:#c0392b;--accent2:#e74c3c;--gold:#f0a500;--silver:#a0a8b8;
  --green:#27ae60;--purple:#8e44ad;--orange:#e67e22;--cyan:#0eb8c4;
  --text:#e8e8f0;--text2:#8888a8;
  --mono:'Share Tech Mono',monospace;--sans:'Rajdhani',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:url('https://CLX33.github.io/planification-tournoi/ss_ec3dd1c52751d8908ffb140a33dc448e39da26d0.1920x1080.jpg');background-size:cover;background-position:center;background-repeat:no-repeat;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;background:rgba(10,10,18,0.82);pointer-events:none;z-index:0;}

/* SIDEBAR */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--bg2);border-right:1px solid var(--border);z-index:100;display:flex;flex-direction:column;}
.sidebar-header{padding:16px 14px 12px;border-bottom:1px solid var(--border);background:var(--bg3);}
.sidebar-logo{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:4px;}
.sidebar-title{font-family:var(--mono);font-size:14px;color:var(--text);}
.sidebar-title span{color:var(--gold);}
.tournament-list{flex:1;overflow-y:auto;padding:8px;}
.tournament-list::-webkit-scrollbar{width:4px;}
.tournament-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.t-item{padding:9px 12px;border-radius:3px;cursor:pointer;border:1px solid transparent;margin-bottom:4px;transition:all .15s;display:flex;align-items:center;gap:8px;}
.t-item:hover{background:var(--bg3);border-color:var(--border);}
.t-item.active{background:rgba(192,57,43,.12);border-color:var(--accent);}
.t-item-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--accent);}
.t-item-name{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-item.active .t-item-name{color:#fff;}
.t-item-del{background:none;border:none;color:transparent;cursor:pointer;font-size:13px;padding:0 2px;transition:color .15s;line-height:1;}
.t-item:hover .t-item-del{color:var(--text2);}
.t-item-del:hover{color:var(--accent2)!important;}
.sidebar-footer{padding:10px 8px;border-top:1px solid var(--border);}
.new-t-btn{width:100%;padding:9px;background:var(--accent);color:#fff;border:none;border-radius:3px;font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:background .15s;}
.new-t-btn:hover{background:var(--accent2);}

/* MAIN */
.main{margin-left:220px;position:relative;z-index:1;}
.app{max-width:900px;margin:0 auto;padding:2rem 1rem 4rem;}

/* HEADER */
header{text-align:center;margin-bottom:2rem;}
header::after{content:'';display:block;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--gold),var(--accent),transparent);margin-top:1rem;}
.title-badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;margin-bottom:.5rem;border:1px solid var(--accent);padding:3px 12px;}
.t-name-input{background:transparent;border:none;outline:none;font-family:var(--mono);font-size:clamp(1.2rem,3.5vw,2rem);letter-spacing:2px;color:var(--text);text-transform:uppercase;text-align:center;width:100%;cursor:text;}
.t-name-input::placeholder{color:var(--text2);}
.t-name-input:focus{color:#fff;border-bottom:1px solid var(--gold);}

/* TOOLBAR */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1.5rem;background:var(--bg2);border:1px solid var(--border);padding:12px 16px;border-radius:4px;align-items:center;}
.toolbar label{font-size:13px;color:var(--text2);font-weight:600;letter-spacing:1px;}
.toolbar input[type="time"]{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:14px;padding:5px 10px;border-radius:3px;outline:none;cursor:pointer;}
.toolbar input[type="time"]:focus{border-color:var(--accent);}
.toolbar input[type="number"]{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:14px;padding:5px 8px;border-radius:3px;width:70px;outline:none;}
.btn{padding:7px 16px;border:none;border-radius:3px;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all .15s;text-transform:uppercase;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent2);}
.btn-secondary{background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);color:var(--text);}
.btn-gold{background:var(--gold);color:#000;}
.btn-gold:hover{filter:brightness(1.1);}
.btn-sm{padding:4px 10px;font-size:11px;}
.sep{flex:1;}

/* DAY LABEL */
.day-label{display:flex;align-items:center;gap:12px;margin:2rem 0 1rem;}
.day-label::before{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.day-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border));}
.day-text{font-family:var(--mono);font-size:11px;letter-spacing:4px;color:var(--text2);text-transform:uppercase;white-space:nowrap;border:1px solid var(--border);padding:3px 14px;}

/* BLOC */
.bloc{background:var(--bg2);border:1px solid var(--border);border-radius:4px;margin-bottom:12px;overflow:hidden;transition:border-color .2s;}
.bloc:hover{border-color:#3a3a55;}
.bloc-header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--border);user-select:none;}
.bloc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.bloc-title-input{background:transparent;border:none;outline:none;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text);letter-spacing:1px;flex:1;text-transform:uppercase;cursor:text;}
.bloc-title-input::placeholder{color:var(--text2);}
.bloc-actions{display:flex;gap:6px;}
.chevron{color:var(--text2);font-size:14px;transition:transform .2s;cursor:pointer;padding:0 4px;}
.chevron.open{transform:rotate(180deg);}

/* ENTRY */
.entries{padding:8px;}
.entry{display:grid;grid-template-columns:110px 1fr 70px 90px 32px;gap:6px;align-items:center;padding:6px 8px;border-radius:3px;margin-bottom:4px;border:1px solid transparent;transition:background .15s;}
.entry:hover{background:var(--bg3);border-color:var(--border);}
.entry-time{font-family:var(--mono);font-size:13px;color:var(--gold);white-space:nowrap;font-weight:700;}
.entry-label-input{background:transparent;border:none;outline:none;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--text);width:100%;}
.entry-label-input::placeholder{color:var(--text2);}
.entry-dur-input{background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-family:var(--mono);font-size:12px;padding:3px 6px;border-radius:2px;width:100%;outline:none;text-align:center;}
.entry-dur-input:focus{border-color:var(--accent);color:var(--text);}
.entry-type{background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-family:var(--sans);font-size:12px;padding:3px 6px;border-radius:2px;width:100%;outline:none;cursor:pointer;}
.entry-del{background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px;transition:color .15s;padding:0 4px;}
.entry-del:hover{color:var(--accent2);}
.entry.type-pause{background:rgba(0,0,0,.2);}
.entry.type-pause .entry-label-input{color:var(--text2);font-style:italic;}
.entry.type-pause .entry-time{color:var(--text2);}
.entry.type-battement .entry-time{color:var(--silver);}
.entry.type-battement .entry-label-input{color:var(--silver);}
.entry.type-finale .entry-time{color:var(--gold);}
.add-entry-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;color:var(--text2);cursor:pointer;font-size:12px;font-family:var(--sans);font-weight:600;border:1px dashed var(--border);border-radius:3px;margin:4px 8px 8px;background:none;width:calc(100% - 16px);letter-spacing:1px;transition:all .15s;text-transform:uppercase;}
.add-entry-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(192,57,43,.05);}
.add-bloc-area{display:flex;gap:10px;flex-wrap:wrap;margin-top:1rem;}

/* COLOR SWATCHES */
.color-pick{display:flex;gap:5px;flex-wrap:wrap;}
.swatch{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s;flex-shrink:0;}
.swatch:hover,.swatch.active{border-color:#fff;}

/* EXPORT */
.export-box{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:1rem;margin-top:1.5rem;}
.export-box h3{font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--text2);margin-bottom:10px;text-transform:uppercase;}
.export-text{background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:12px;border-radius:3px;width:100%;min-height:120px;line-height:1.6;resize:vertical;outline:none;}

/* EMPTY STATE */
.empty-state{text-align:center;padding:4rem 2rem;color:var(--text2);}
.empty-state h2{font-family:var(--mono);font-size:16px;letter-spacing:2px;margin-bottom:1rem;color:var(--text);}
.empty-state p{font-size:14px;margin-bottom:1.5rem;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:2rem;width:90%;max-width:400px;}
.modal h3{font-family:var(--mono);font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--text);margin-bottom:1.5rem;}
.modal input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--sans);font-size:16px;font-weight:600;padding:10px 14px;border-radius:3px;outline:none;margin-bottom:1rem;}
.modal input:focus{border-color:var(--accent);}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;}

/* SAVE */
.save-indicator{position:fixed;bottom:20px;right:20px;z-index:300;background:var(--green);color:#fff;font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:3px;letter-spacing:1px;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;}
.save-indicator.show{opacity:1;transform:translateY(0);}

@media(max-width:600px){.sidebar{width:180px;}.main{margin-left:180px;}.entry{grid-template-columns:90px 1fr 60px 32px;}.entry-type{display:none;}}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">⚡ Tournament</div>
    <div class="sidebar-title">Planning <span>Pro</span></div>
  </div>
  <div class="tournament-list" id="tournamentList"></div>
  <div class="sidebar-footer">
    <button class="new-t-btn" onclick="openNewModal()">+ Nouveau tournoi</button>
  </div>
</div>

<div class="main">
  <div class="app" id="app"></div>
</div>

<div class="save-indicator" id="saveIndicator">✓ Sauvegardé</div>

<div class="modal-overlay" id="newModal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>Nouveau tournoi</h3>
    <input type="text" id="newTournamentName" placeholder="Nom du tournoi..." maxlength="50" onkeydown="if(event.key==='Enter')createTournament()">
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="createTournament()">Créer</button>
    </div>
  </div>
</div>

<script>
const COLORS={green:'#27ae60',yellow:'#f0a500',red:'#c0392b',purple:'#8e44ad',orange:'#e67e22',cyan:'#0eb8c4',white:'#888899',black:'#444456'};
const COLOR_KEYS=Object.keys(COLORS);
const TYPES=['match','pause','battement','finale','loser','placement'];
const DOT_MAP={green:'🟢',yellow:'🟡',red:'🔴',orange:'🟠',purple:'🟣',cyan:'🔵',black:'⚫',white:'⚪'};

let tournaments={};
let activeTournamentId=null;
let saveTimer=null;

function uid(){return Math.random().toString(36).slice(2,9);}
function timeToMin(s){const[h,m]=s.split(':').map(Number);return h*60+m;}
function minToTime(m){const h=Math.floor(m/60)%24,mn=m%60;return`${String(h).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function save(){
  try{localStorage.setItem('tournoiPro_v3',JSON.stringify({tournaments,activeTournamentId}));}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const el=document.getElementById('saveIndicator');
    el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'),1800);
  },400);
}

function load(){
  try{
    const raw=localStorage.getItem('tournoiPro_v3');
    if(raw){const d=JSON.parse(raw);tournaments=d.tournaments||{};activeTournamentId=d.activeTournamentId||null;}
  }catch(e){}
  if(Object.keys(tournaments).length===0){
    const t=makeDefaultTournament('Mon Premier Tournoi');
    tournaments[t.id]=t;activeTournamentId=t.id;save();
  }
  if(!tournaments[activeTournamentId])activeTournamentId=Object.keys(tournaments)[0]||null;
}

function makeDefaultTournament(name){
  const id=uid();
  return{id,name,startDay1:'15:15',startDay2:'20:00',defaultDur:10,
    day1:[
      {id:uid(),title:'QUAL PHASE 3A',color:'green',open:true,entries:[
        {id:uid(),label:'MATCH 1 (Seed 1)',dur:10,type:'match'},
        {id:uid(),label:'Battement',dur:5,type:'battement'},
        {id:uid(),label:'MATCH 2 (Seed 2)',dur:10,type:'match'},
        {id:uid(),label:'☕ PAUSE',dur:8,type:'pause'},
      ]},
      {id:uid(),title:'QUAL PHASE 3B',color:'green',open:true,entries:[
        {id:uid(),label:'MATCH 3 (Seed 3)',dur:10,type:'match'},
        {id:uid(),label:'Battement',dur:5,type:'battement'},
        {id:uid(),label:'MATCH 4 (Seed 4)',dur:10,type:'match'},
        {id:uid(),label:'Battement',dur:5,type:'battement'},
      ]},
      {id:uid(),title:'LOSER BRACKET',color:'black',open:true,entries:[
        {id:uid(),label:'LOSER MATCH',dur:10,type:'loser'},
        {id:uid(),label:'☕ PAUSE',dur:8,type:'pause'},
      ]},
      {id:uid(),title:'QUAL PHASE 2A & 2B',color:'yellow',open:true,entries:[
        {id:uid(),label:'QUAL PHASE 2A (9th-12th)',dur:10,type:'placement'},
        {id:uid(),label:'Battement',dur:5,type:'battement'},
        {id:uid(),label:'QUAL PHASE 2B (9th-12th)',dur:10,type:'placement'},
        {id:uid(),label:'☕ PAUSE',dur:8,type:'pause'},
      ]},
      {id:uid(),title:'PLACEMENT 7th-8th',color:'orange',open:true,entries:[
        {id:uid(),label:'MATCH 7th-8th A',dur:10,type:'match'},
        {id:uid(),label:'Battement',dur:5,type:'battement'},
        {id:uid(),label:'MATCH 7th-8th B',dur:10,type:'match'},
        {id:uid(),label:'☕ PAUSE',dur:8,type:'pause'},
      ]},
    ],
    day2:[
      {id:uid(),title:'QUART & DEMI-FINALE',color:'red',open:true,entries:[
        {id:uid(),label:'QUART DE FINALE (5-6 place)',dur:10,type:'match'},
        {id:uid(),label:'☕ PAUSE',dur:8,type:'pause'},
        {id:uid(),label:'DEMI-FINALE (Top 4)',dur:10,type:'match'},
        {id:uid(),label:'☕ PAUSE',dur:8,type:'pause'},
      ]},
      {id:uid(),title:'PETITE FINALE (BO5) — 3rd 45€ / 4th 0€',color:'purple',open:true,entries:[
        {id:uid(),label:'Manche 1',dur:10,type:'finale'},{id:uid(),label:'Battement',dur:5,type:'battement'},
        {id:uid(),label:'Manche 2',dur:10,type:'finale'},{id:uid(),label:'Battement',dur:5,type:'battement'},
        {id:uid(),label:'Manche 3',dur:10,type:'finale'},{id:uid(),label:'Battement',dur:5,type:'battement'},
        {id:uid(),label:'Manche 4 (si besoin)',dur:10,type:'finale'},{id:uid(),label:'Battement',dur:5,type:'battement'},
        {id:uid(),label:'Manche 5 (si besoin)',dur:10,type:'finale'},
        {id:uid(),label:'☕ PAUSE',dur:8,type:'pause'},
      ]},
      {id:uid(),title:'GRANDE FINALE (BO5) — 1st 240€ / 2nd 105€',color:'yellow',open:true,entries:[
        {id:uid(),label:'Manche 1',dur:10,type:'finale'},{id:uid(),label:'Battement',dur:5,type:'battement'},
        {id:uid(),label:'Manche 2',dur:10,type:'finale'},{id:uid(),label:'Battement',dur:5,type:'battement'},
        {id:uid(),label:'Manche 3',dur:10,type:'finale'},{id:uid(),label:'Battement',dur:5,type:'battement'},
        {id:uid(),label:'Manche 4 (si besoin)',dur:10,type:'finale'},{id:uid(),label:'Battement',dur:5,type:'battement'},
        {id:uid(),label:'Manche 5 (si besoin)',dur:10,type:'finale'},
      ]},
    ]
  };
}

function makeEmptyTournament(name){
  const id=uid();
  return{id,name,startDay1:'10:00',startDay2:'14:00',defaultDur:10,
    day1:[{id:uid(),title:'BLOC 1',color:'green',open:true,entries:[
      {id:uid(),label:'Match 1',dur:10,type:'match'},
      {id:uid(),label:'Battement',dur:5,type:'battement'},
      {id:uid(),label:'Match 2',dur:10,type:'match'},
      {id:uid(),label:'☕ PAUSE',dur:8,type:'pause'},
    ]}],
    day2:[{id:uid(),title:'FINALE',color:'yellow',open:true,entries:[
      {id:uid(),label:'Grande Finale',dur:10,type:'finale'},
    ]}]
  };
}

function getT(){return tournaments[activeTournamentId];}

function switchTournament(id){activeTournamentId=id;save();renderSidebar();renderApp();}

function openNewModal(){document.getElementById('newModal').style.display='flex';setTimeout(()=>document.getElementById('newTournamentName').focus(),50);}
function closeModal(){document.getElementById('newModal').style.display='none';document.getElementById('newTournamentName').value='';}
function createTournament(){
  const name=document.getElementById('newTournamentName').value.trim()||'Nouveau Tournoi';
  const isFirst=Object.keys(tournaments).length===0;
  const t=isFirst?makeDefaultTournament(name):makeEmptyTournament(name);
  t.name=name;
  tournaments[t.id]=t;activeTournamentId=t.id;
  save();closeModal();renderSidebar();renderApp();
}
function deleteTournament(id){
  if(Object.keys(tournaments).length<=1){alert('Impossible de supprimer le dernier tournoi.');return;}
  if(!confirm('Supprimer ce tournoi définitivement ?'))return;
  delete tournaments[id];
  if(activeTournamentId===id)activeTournamentId=Object.keys(tournaments)[0];
  save();renderSidebar();renderApp();
}

function renderSidebar(){
  const list=document.getElementById('tournamentList');
  list.innerHTML='';
  Object.values(tournaments).forEach(t=>{
    const item=document.createElement('div');
    item.className=`t-item ${t.id===activeTournamentId?'active':''}`;
    item.innerHTML=`<div class="t-item-dot"></div><div class="t-item-name">${esc(t.name)}</div><button class="t-item-del" title="Supprimer" onclick="event.stopPropagation();deleteTournament('${t.id}')">✕</button>`;
    item.addEventListener('click',()=>switchTournament(t.id));
    list.appendChild(item);
  });
}

function calcTimes(t){
  for(const day of['day1','day2']){
    let cur=timeToMin(day==='day1'?t.startDay1:t.startDay2);
    for(const bloc of t[day])for(const e of bloc.entries){e._start=cur;e._end=cur+(parseInt(e.dur)||0);cur=e._end;}
  }
}

function renderApp(){
  const app=document.getElementById('app');
  const t=getT();
  if(!t){app.innerHTML='<div class="empty-state"><h2>Aucun tournoi</h2><p>Crée un nouveau tournoi pour commencer.</p><button class="btn btn-primary" onclick="openNewModal()">+ Créer un tournoi</button></div>';return;}
  calcTimes(t);
  app.innerHTML='';

  // Header
  const hdr=document.createElement('header');
  hdr.innerHTML=`<div class="title-badge">⚡ Tournament Manager</div><br><input class="t-name-input" value="${esc(t.name)}" placeholder="Nom du tournoi..." maxlength="50" oninput="renameTournament(this.value)">`;
  app.appendChild(hdr);

  // Toolbar
  const tb=document.createElement('div');
  tb.className='toolbar';
  tb.innerHTML=`<label>DÉBUT J1</label><input type="time" value="${t.startDay1}" oninput="updateSetting('startDay1',this.value)"><label style="margin-left:10px">DÉBUT J2</label><input type="time" value="${t.startDay2}" oninput="updateSetting('startDay2',this.value)"><label style="margin-left:10px">Durée match (min)</label><input type="number" value="${t.defaultDur}" min="1" max="120" oninput="updateSetting('defaultDur',this.value)"><div class="sep"></div><button class="btn btn-secondary" onclick="doExport()">📋 Exporter</button><button class="btn btn-gold" onclick="doCopy()">Copier</button>`;
  app.appendChild(tb);

  // Planner
  const planner=document.createElement('div');
  planner.id='planner';
  app.appendChild(planner);

  // Add bloc
  const addArea=document.createElement('div');
  addArea.className='add-bloc-area';
  addArea.innerHTML=`<button class="btn btn-secondary" onclick="addBloc('day1')">+ Bloc Jour 1</button><button class="btn btn-secondary" onclick="addBloc('day2')">+ Bloc Jour 2</button>`;
  app.appendChild(addArea);

  // Export box
  const expBox=document.createElement('div');
  expBox.className='export-box';expBox.id='exportBox';expBox.style.display='none';
  expBox.innerHTML=`<h3>🖨️ Export texte</h3><textarea class="export-text" id="exportTA" readonly></textarea>`;
  app.appendChild(expBox);

  renderPlanner();
}

function renderPlanner(){
  const planner=document.getElementById('planner');
  if(!planner)return;
  const t=getT();if(!t)return;
  calcTimes(t);
  planner.innerHTML='';
  planner.appendChild(makeDayLabel('JOUR 1'));
  for(const b of t.day1)planner.appendChild(renderBloc(b,'day1'));
  planner.appendChild(makeDayLabel('JOUR 2'));
  for(const b of t.day2)planner.appendChild(renderBloc(b,'day2'));
}

function makeDayLabel(text){
  const d=document.createElement('div');
  d.className='day-label';
  d.innerHTML=`<span class="day-text">${text}</span>`;
  return d;
}

function renderBloc(bloc,day){
  const wrapper=document.createElement('div');
  wrapper.className='bloc';
  const hdr=document.createElement('div');
  hdr.className='bloc-header';
  hdr.innerHTML=`
    <div class="bloc-dot" style="background:${COLORS[bloc.color]||'#888'}"></div>
    <input class="bloc-title-input" value="${esc(bloc.title)}" placeholder="Nom du bloc" oninput="updateBlocTitle('${day}','${bloc.id}',this.value)">
    <div class="color-pick">${COLOR_KEYS.map(c=>`<div class="swatch ${bloc.color===c?'active':''}" style="background:${COLORS[c]}" title="${c}" onclick="setBlocColor('${day}','${bloc.id}','${c}')"></div>`).join('')}</div>
    <div class="bloc-actions">
      <button class="btn btn-secondary btn-sm" onclick="moveBloc('${day}','${bloc.id}',-1)">↑</button>
      <button class="btn btn-secondary btn-sm" onclick="moveBloc('${day}','${bloc.id}',1)">↓</button>
      <button class="btn btn-secondary btn-sm" onclick="deleteBloc('${day}','${bloc.id}')" style="color:var(--accent)">✕</button>
    </div>
    <span class="chevron ${bloc.open?'open':''}" onclick="toggleBloc('${day}','${bloc.id}')">▼</span>`;
  wrapper.appendChild(hdr);
  if(!bloc.open)return wrapper;

  const entries=document.createElement('div');
  entries.className='entries';
  for(const e of bloc.entries){
    const row=document.createElement('div');
    row.className=`entry type-${e.type}`;
    row.innerHTML=`
      <div class="entry-time">${minToTime(e._start)} - ${minToTime(e._end)}</div>
      <input class="entry-label-input" value="${esc(e.label)}" placeholder="Description..." oninput="updateEntry('${day}','${bloc.id}','${e.id}','label',this.value)">
      <input class="entry-dur-input" type="number" value="${e.dur}" min="0" max="300" title="Durée (min)" oninput="updateEntry('${day}','${bloc.id}','${e.id}','dur',this.value)">
      <select class="entry-type" onchange="updateEntry('${day}','${bloc.id}','${e.id}','type',this.value)">${TYPES.map(tp=>`<option value="${tp}" ${e.type===tp?'selected':''}>${tp}</option>`).join('')}</select>
      <button class="entry-del" onclick="deleteEntry('${day}','${bloc.id}','${e.id}')">✕</button>`;
    entries.appendChild(row);
  }
  const addBtn=document.createElement('button');
  addBtn.className='add-entry-btn';addBtn.textContent='+ Ajouter une entrée';
  addBtn.onclick=()=>addEntry(day,bloc.id);
  entries.appendChild(addBtn);
  wrapper.appendChild(entries);
  return wrapper;
}

// ACTIONS
function renameTournament(val){const t=getT();if(!t)return;t.name=val;save();renderSidebar();}
function updateSetting(key,val){const t=getT();if(!t)return;t[key]=val;save();renderPlanner();}
function toggleBloc(day,id){const t=getT();if(!t)return;const b=t[day].find(b=>b.id===id);if(b){b.open=!b.open;save();renderPlanner();}}
function updateBlocTitle(day,id,val){const t=getT();if(!t)return;const b=t[day].find(b=>b.id===id);if(b){b.title=val;save();}}
function setBlocColor(day,id,color){const t=getT();if(!t)return;const b=t[day].find(b=>b.id===id);if(b){b.color=color;save();renderPlanner();}}
function moveBloc(day,id,dir){
  const t=getT();if(!t)return;const arr=t[day];const i=arr.findIndex(b=>b.id===id);const ni=i+dir;
  if(ni<0||ni>=arr.length)return;[arr[i],arr[ni]]=[arr[ni],arr[i]];save();renderPlanner();
}
function deleteBloc(day,id){const t=getT();if(!t)return;t[day]=t[day].filter(b=>b.id!==id);save();renderPlanner();}
function addBloc(day){
  const t=getT();if(!t)return;
  t[day].push({id:uid(),title:'NOUVEAU BLOC',color:'cyan',open:true,entries:[{id:uid(),label:'Match',dur:parseInt(t.defaultDur)||10,type:'match'}]});
  save();renderPlanner();
}
function addEntry(day,blocId){
  const t=getT();if(!t)return;const b=t[day].find(b=>b.id===blocId);if(!b)return;
  b.entries.push({id:uid(),label:'Match',dur:parseInt(t.defaultDur)||10,type:'match'});save();renderPlanner();
}
function updateEntry(day,blocId,entryId,key,val){
  const t=getT();if(!t)return;const b=t[day].find(b=>b.id===blocId);if(!b)return;
  const e=b.entries.find(e=>e.id===entryId);if(!e)return;
  e[key]=key==='dur'?parseInt(val)||0:val;save();if(key==='dur'||key==='type')renderPlanner();
}
function deleteEntry(day,blocId,entryId){
  const t=getT();if(!t)return;const b=t[day].find(b=>b.id===blocId);if(!b)return;
  b.entries=b.entries.filter(e=>e.id!==entryId);save();renderPlanner();
}

// EXPORT
function buildExport(){
  const t=getT();if(!t)return'';calcTimes(t);
  let out=`🕒 PLANNING — ${t.name}\n${'═'.repeat(40)}\n\n`;
  for(const day of['day1','day2']){
    out+=day==='day1'?`📅 JOUR 1\n${'─'.repeat(30)}\n`:`\n📅 JOUR 2\n${'─'.repeat(30)}\n`;
    for(const bloc of t[day]){
      const dot=DOT_MAP[bloc.color]||'⚫';
      out+=`\n${dot} ${bloc.title}\n`;
      for(const e of bloc.entries){const icon=e.type==='pause'?'☕ ':'   ';out+=`${icon}${minToTime(e._start)} - ${minToTime(e._end)} | ${e.label} (${e.dur} min)\n`;}
    }
  }
  return out;
}
function doExport(){
  const box=document.getElementById('exportBox');const ta=document.getElementById('exportTA');
  if(!box||!ta)return;ta.value=buildExport();box.style.display='block';box.scrollIntoView({behavior:'smooth'});
}
function doCopy(){
  const text=buildExport();
  navigator.clipboard.writeText(text).catch(()=>{doExport();const ta=document.getElementById('exportTA');if(ta){ta.select();document.execCommand('copy');}});
  const btn=event.target;btn.textContent='✓ Copié !';setTimeout(()=>btn.textContent='Copier',1500);
  doExport();
}

load();renderSidebar();renderApp();
</script>
